name: Deploy on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [ main ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Set image tag from PR
        run: |
          echo "IMAGE_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: lzhengqc/visualsubnetcalc-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps deployment
        run: |
          sed -i "s|image: .*|image: ghcr.io/lzhengqc/visualsubnetcalc:${IMAGE_TAG}|g" \
            gitops/k8s/deployment.yaml

          cd gitops
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git commit -am "deploy: visualsubnetcalc ${IMAGE_TAG}" || echo "No changes to commit"
          git push
