- name: Wait for Codex review and validate
  uses: actions/github-script@v7
  with:
    github-token: ${{ secrets.GITHUB_TOKEN }}
    script: |
      const pr = context.payload.pull_request;
      const prNumber = pr.number;
      const latestCommitTime = new Date(pr.updated_at);

      const MAX_ATTEMPTS = 30;
      const DELAY = 10000;

      async function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function isFromCodex(user) {
        return user?.login?.toLowerCase().includes("codex");
      }

      function isAfterLatestCommit(dateStr) {
        return new Date(dateStr) >= latestCommitTime;
      }

      function hasBlockingIssue(text) {
        if (!text) return false;
        const t = text.toLowerCase();
        return (
          t.includes("critical") ||
          t.includes("security") ||
          t.includes("bug") ||
          t.includes("❌")
        );
      }

      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        console.log(`🔍 Attempt ${attempt}`);

        // ✅ Issue comments (paginated)
        const comments = await github.paginate(
          github.rest.issues.listComments,
          {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          }
        );

        // ✅ PR reviews
        const reviews = await github.paginate(
          github.rest.pulls.listReviews,
          {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          }
        );

        // ✅ INLINE review comments (CRITICAL FIX)
        const reviewComments = await github.paginate(
          github.rest.pulls.listReviewComments,
          {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          }
        );

        // ✅ Reactions
        const reactions = await github.paginate(
          github.rest.reactions.listForIssue,
          {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          }
        );

        const codexComments = comments.filter(c =>
          isFromCodex(c.user) && isAfterLatestCommit(c.created_at)
        );

        const codexReviews = reviews.filter(r =>
          isFromCodex(r.user) && isAfterLatestCommit(r.submitted_at)
        );

        const codexInline = reviewComments.filter(c =>
          isFromCodex(c.user) && isAfterLatestCommit(c.created_at)
        );

        const codexThumbsup = reactions.find(r =>
          isFromCodex(r.user) &&
          r.content === "+1" &&
          isAfterLatestCommit(r.created_at)
        );

        // 🔥 FAIL if any inline comment has issues
        for (const c of [...codexComments, ...codexReviews, ...codexInline]) {
          if (hasBlockingIssue(c.body)) {
            core.setFailed("❌ Codex reported issues.");
            return;
          }
        }

        // ✅ PASS if any Codex signal exists
        if (
          codexComments.length > 0 ||
          codexReviews.length > 0 ||
          codexInline.length > 0 ||
          codexThumbsup
        ) {
          console.log("✅ Codex review detected.");
          return;
        }

        if (attempt < MAX_ATTEMPTS) {
          console.log("⏳ Waiting...");
          await sleep(DELAY);
        }
      }

      core.setFailed("❌ Codex did not respond in time.");